<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found. Thorne &amp; Willow.</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ecede7">
<!-- Self-contained on purpose: a 404 is served from any URL depth, so a
     relative stylesheet path would resolve differently every time. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    background: #ecede7;
    color: #1c1f19;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    line-height: 1.68;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; display: flex; flex-direction: column; gap: 24px; }
  .mark { display: flex; align-items: baseline; gap: 8px; font-family: Georgia, "Times New Roman", serif; font-size: 21px; }
  .mark i { font-size: 15px; color: #565c50; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(34px, 6vw, 54px); line-height: 1.14; letter-spacing: -0.005em; padding-bottom: 0.08em; }
  h1 i { font-style: italic; }
  p { color: #565c50; max-width: 30rem; }
  a.btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    margin-top: 8px;
    padding: 14px 28px;
    background: #294c63;
    color: #f2f3ee;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
  }
  a.btn:hover { background: #1b3547; }
  a.btn:focus-visible { outline: 2px solid #1c1f19; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <span class="mark">Thorne <i>&amp;</i> Willow</span>
    <h1>this path has <i>grown over.</i></h1>
    <p>The page you were after is not here. The garden, happily, still is.</p>
    <a class="btn" href="/">Back to the garden</a>
  </main>
</body>
</html>
