# Deploy the demo site to GitHub Pages.
# No build step: the repository root is the site.
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Verify asset paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every local reference resolves
        run: bash scripts/check-links.sh

  deploy:
    name: Deploy
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # enablement:true lets the workflow turn Pages on itself. Without it,
      # configure-pages asks GitHub for a Pages site, gets a 404 on a repo
      # where Pages was never switched on, and the deploy fails before it
      # uploads anything.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
